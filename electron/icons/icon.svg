<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 3D Geometric Isometric Box -->
  <g filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="256,96 396,176 256,256 116,176" fill="url(#topFace)" />
    <!-- Left Face -->
    <polygon points="116,196 244,270 244,406 116,332" fill="url(#leftFace)" />
    <!-- Right Face -->
    <polygon points="268,270 396,196 396,332 268,406" fill="url(#rightFace)" />
    <!-- Center Core Glow Indicator -->
    <circle cx="256" cy="256" r="28" fill="#38bdf8" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
